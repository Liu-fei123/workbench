<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的工作台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: #f5f0e8;
            color: #333;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #5a7c5a 0%, #4a6c4a 100%);
            color: white;
            padding: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .menu-toggle {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-title { font-size: 20px; font-weight: 600; }
        .header-date { font-size: 13px; opacity: 0.9; }
        .reset-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 220px;
            background: white;
            z-index: 200;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            overflow-y: auto;
            padding-top: 60px;
        }
        .sidebar.active {
            transform: translateX(0);
        }
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 150;
            display: none;
        }
        .sidebar-overlay.active {
            display: block;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            cursor: pointer;
            font-size: 15px;
        }
        .nav-item:hover {
            background: #f5f0e8;
        }
        .nav-item.active {
            background: #5a7c5a;
            color: white;
        }
        .nav-icon {
            font-size: 20px;
        }
        .content {
            padding: 16px;
            padding-bottom: 20px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .todo-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: #f5f0e8;
            border-radius: 10px;
            margin-bottom: 8px;
        }
        .todo-checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid #7a9c7a;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .todo-checkbox.checked {
            background: #5a7c5a;
            border-color: #5a7c5a;
        }
        .todo-checkbox.checked::after {
            content: '✓';
            color: white;
            font-size: 12px;
        }
        .todo-text { flex: 1; font-size: 15px; }
        .todo-text.completed {
            text-decoration: line-through;
            color: #888;
        }
        .todo-input-area {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .todo-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #e8e4dc;
            border-radius: 10px;
            font-size: 15px;
            background: #f5f0e8;
        }
        .btn-primary {
            background: #5a7c5a;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        .finance-box {
            background: #f5f0e8;
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            margin-bottom: 12px;
        }
        .finance-value {
            font-size: 24px;
            font-weight: 700;
            color: #5a7c5a;
        }
        .finance-label {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        .word-tag {
            display: inline-block;
            background: #f5f0e8;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
            margin: 4px;
        }
        .idea-card {
            background: linear-gradient(135deg, #fff9e6 0%, #fff5d6 100%);
            border-left: 4px solid #c9a96e;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .book-card {
            background: #f5f0e8;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 10px;
        }
        .expense-item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid #e8e4dc;
        }
        .form-input, .form-textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #e8e4dc;
            border-radius: 10px;
            font-size: 15px;
            margin-bottom: 10px;
        }
        .form-textarea {
            min-height: 80px;
            resize: vertical;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .modal-close {
            font-size: 24px;
            color: #888;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    
    <div class="sidebar" id="sidebar">
        <div class="nav-item active" onclick="switchSection('todo')">
            <span class="nav-icon">📋</span>
            <span>今日清单</span>
        </div>
        <div class="nav-item" onclick="switchSection('morning')">
            <span class="nav-icon">🌅</span>
            <span>晨间习惯</span>
        </div>
        <div class="nav-item" onclick="switchSection('books')">
            <span class="nav-icon">📚</span>
            <span>读书笔记</span>
        </div>
        <div class="nav-item" onclick="switchSection('ideas')">
            <span class="nav-icon">💡</span>
            <span>灵感收集</span>
        </div>
        <div class="nav-item" onclick="switchSection('finance')">
            <span class="nav-icon">💰</span>
            <span>理财记账</span>
        </div>
        <div class="nav-item" onclick="switchSection('english')">
            <span class="nav-icon">🌍</span>
            <span>英语学习</span>
        </div>
        <div class="nav-item" onclick="switchSection('ai')">
            <span class="nav-icon">🤖</span>
            <span>AI学习</span>
        </div>
        <div class="nav-item" onclick="switchSection('creator')">
            <span class="nav-icon">🎬</span>
            <span>自媒体创作</span>
        </div>
    </div>

    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                <div>
                    <div class="header-title">我的工作台</div>
                    <div class="header-date" id="currentDate">--</div>
                </div>
            </div>
            <button class="reset-btn" onclick="resetToday()">重置今日</button>
        </div>
    </div>

    <div class="content">
        <div class="section active" id="section-todo">
            <div class="section-title">今日清单</div>
            <div class="card">
                <div id="todoList"></div>
                <div class="todo-input-area">
                    <input type="text" class="todo-input" id="todoInput" placeholder="添加新任务...">
                    <button class="btn-primary" onclick="addTodo()">添加</button>
                </div>
            </div>
        </div>

        <div class="section" id="section-morning">
            <div class="section-title">晨间习惯</div>
            <div class="card">
                <div style="text-align: center; padding: 20px;">
                    <div style="font-size: 48px;">⏰</div>
                    <div style="font-size: 28px; font-weight: 700; color: #5a7c5a;" id="wakeUpTime">--:--</div>
                    <button class="btn-primary" onclick="checkInMorning()" style="margin-top: 12px; width: 100%;">打卡早起</button>
                </div>
            </div>
            <div class="card">
                <div class="section-title">晨间时间规划</div>
                <div id="morningSchedule"></div>
                <div style="margin-top: 12px;">
                    <select class="form-input" id="morningActivityType">
                        <option value="读书">读书</option>
                        <option value="学习">学习</option>
                        <option value="健身">健身</option>
                        <option value="冥想">冥想</option>
                        <option value="写作">写作</option>
                    </select>
                    <input type="number" class="form-input" id="morningDuration" placeholder="时长(分钟)">
                    <button class="btn-primary" onclick="addMorningActivity()">添加</button>
                </div>
            </div>
        </div>

        <div class="section" id="section-books">
            <div class="section-title">读书笔记</div>
            <div id="bookList"></div>
            <button class="btn-primary" onclick="openBookModal()" style="margin-top: 12px;">+ 添加书籍</button>
        </div>

        <div class="section" id="section-ideas">
            <div class="section-title">灵感收集</div>
            <div class="card">
                <textarea class="form-textarea" id="ideaInput" placeholder="记录灵感..."></textarea>
                <button class="btn-primary" onclick="addIdea()">记录灵感</button>
            </div>
            <div id="ideaList"></div>
        </div>

        <div class="section" id="section-finance">
            <div class="section-title">理财记账</div>
            <div class="finance-box">
                <div class="finance-value" id="totalBalance">¥0</div>
                <div class="finance-label">结余</div>
            </div>
            <div class="card">
                <div id="expenseList"></div>
                <input type="text" class="form-input" id="expenseName" placeholder="项目名称">
                <input type="number" class="form-input" id="expenseAmount" placeholder="金额">
                <button class="btn-primary" onclick="addExpense()">记账</button>
            </div>
        </div>

        <div class="section" id="section-english">
            <div class="section-title">英语学习</div>
            <div class="card">
                <div class="finance-box">
                    <div class="finance-value" id="wordCount">0</div>
                    <div class="finance-label">今日单词</div>
                </div>
                <div class="todo-input-area">
                    <input type="text" class="todo-input" id="wordInput" placeholder="输入单词...">
                    <button class="btn-primary" onclick="addWord()">添加</button>
                </div>
                <div id="wordList"></div>
            </div>
        </div>

        <div class="section" id="section-ai">
            <div class="section-title">AI学习</div>
            <div class="card">
                <div class="book-card" onclick="window.open('https://www.deeplearning.ai/','_blank')">
                    <div style="font-size: 24px;">🎓</div>
                    <div style="font-weight: 600;">DeepLearning.AI</div>
                    <div style="font-size: 13px; color: #888;">吴恩达的AI课程</div>
                </div>
                <div class="book-card" onclick="window.open('https://huggingface.co/','_blank')">
                    <div style="font-size: 24px;">🤗</div>
                    <div style="font-weight: 600;">Hugging Face</div>
                    <div style="font-size: 13px; color: #888;">开源AI模型社区</div>
                </div>
                <textarea class="form-textarea" id="aiNote" placeholder="学习笔记..." onblur="saveAiNote()"></textarea>
            </div>
        </div>

        <div class="section" id="section-creator">
            <div class="section-title">自媒体创作</div>
            <div class="card">
                <div id="topicList"></div>
                <button class="btn-primary" onclick="openTopicModal()">+ 添加选题</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="bookModal">
        <div class="modal">
            <div class="modal-header">
                <div style="font-weight: 600;">添加书籍</div>
                <span class="modal-close" onclick="closeBookModal()">×</span>
            </div>
            <input type="text" class="form-input" id="bookTitle" placeholder="书名">
            <input type="text" class="form-input" id="bookAuthor" placeholder="作者">
            <textarea class="form-textarea" id="bookNote" placeholder="读书笔记..."></textarea>
            <button class="btn-primary" onclick="saveBook()" style="width: 100%;">保存</button>
        </div>
    </div>

    <div class="modal-overlay" id="topicModal">
        <div class="modal">
            <div class="modal-header">
                <div style="font-weight: 600;">添加选题</div>
                <span class="modal-close" onclick="closeTopicModal()">×</span>
            </div>
            <input type="text" class="form-input" id="topicTitle" placeholder="选题标题">
            <textarea class="form-textarea" id="topicOutline" placeholder="内容大纲..."></textarea>
            <button class="btn-primary" onclick="saveTopic()" style="width: 100%;">保存</button>
        </div>
    </div>

    <script>
        var todos = JSON.parse(localStorage.getItem('todos') || '[{"id":1,"text":"阅读30分钟","completed":false},{"id":2,"text":"背单词50个","completed":false},{"id":3,"text":"记录今日开销","completed":false}]');
        var books = JSON.parse(localStorage.getItem('books') || '[]');
        var ideas = JSON.parse(localStorage.getItem('ideas') || '[]');
        var expenses = JSON.parse(localStorage.getItem('expenses') || '[]');
        var words = JSON.parse(localStorage.getItem('words') || '[]');
        var topics = JSON.parse(localStorage.getItem('topics') || '[]');
        var morningData = JSON.parse(localStorage.getItem('morningData') || '{"checkIns":[],"activities":[],"streak":0}');
        var aiNote = localStorage.getItem('aiNote') || '';

        function saveData() {
            localStorage.setItem('todos', JSON.stringify(todos));
            localStorage.setItem('books', JSON.stringify(books));
            localStorage.setItem('ideas', JSON.stringify(ideas));
            localStorage.setItem('expenses', JSON.stringify(expenses));
            localStorage.setItem('words', JSON.stringify(words));
            localStorage.setItem('topics', JSON.stringify(topics));
            localStorage.setItem('morningData', JSON.stringify(morningData));
            localStorage.setItem('aiNote', aiNote);
        }

        function toggleSidebar() {
            var sidebar = document.getElementById('sidebar');
            var overlay = document.getElementById('sidebarOverlay');
            if (sidebar.classList.contains('active')) {
                sidebar.classList.remove('active');
                overlay.classList.remove('active');
            } else {
                sidebar.classList.add('active');
                overlay.classList.add('active');
            }
        }

        function switchSection(section) {
            var sections = document.querySelectorAll('.section');
            for (var i = 0; i < sections.length; i++) {
                sections[i].classList.remove('active');
            }
            document.getElementById('section-' + section).classList.add('active');
            
            var navItems = document.querySelectorAll('.nav-item');
            for (var i = 0; i < navItems.length; i++) {
                navItems[i].classList.remove('active');
            }
            event.currentTarget.classList.add('active');
            
            toggleSidebar();
        }

        function updateDate() {
            var now = new Date();
            var weekDays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            document.getElementById('currentDate').textContent = now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日 · ' + weekDays[now.getDay()];
        }

        function renderTodos() {
            var list = document.getElementById('todoList');
            var html = '';
            for (var i = 0; i < todos.length; i++) {
                var todo = todos[i];
                html += '<div class="todo-item">';
                html += '<div class="todo-checkbox ' + (todo.completed ? 'checked' : '') + '" onclick="toggleTodo(' + todo.id + ')"></div>';
                html += '<div class="todo-text ' + (todo.completed ? 'completed' : '') + '">' + todo.text + '</div>';
                html += '<span onclick="deleteTodo(' + todo.id + ')" style="color:#888;">×</span>';
                html += '</div>';
            }
            list.innerHTML = html;
        }

        function addTodo() {
            var input = document.getElementById('todoInput');
            var text = input.value.trim();
            if (!text) return;
            todos.push({id: Date.now(), text: text, completed: false});
            saveData();
            input.value = '';
            renderTodos();
        }

        function toggleTodo(id) {
            for (var i = 0; i < todos.length; i++) {
                if (todos[i].id === id) {
                    todos[i].completed = !todos[i].completed;
                    break;
                }
            }
            saveData();
            renderTodos();
        }

        function deleteTodo(id) {
            var newTodos = [];
            for (var i = 0; i < todos.length; i++) {
                if (todos[i].id !== id) newTodos.push(todos[i]);
            }
            todos = newTodos;
            saveData();
            renderTodos();
        }

        function resetToday() {
            if (!confirm('确定重置?')) return;
            for (var i = 0; i < todos.length; i++) {
                todos[i].completed = false;
            }
            saveData();
            renderTodos();
        }

        function renderBooks() {
            var list = document.getElementById('bookList');
            if (books.length === 0) {
                list.innerHTML = '<div class="empty-state">还没有书籍</div>';
                return;
            }
            var html = '';
            for (var i = 0; i < books.length; i++) {
                var book = books[i];
                html += '<div class="book-card">';
                html += '<div style="font-weight:600;">' + book.title + '</div>';
                html += '<div style="font-size:13px;color:#888;">' + book.author + '</div>';
                if (book.note) html += '<div style="font-size:13px;color:#888;margin-top:8px;">' + book.note + '</div>';
                html += '</div>';
            }
            list.innerHTML = html;
        }

        function openBookModal() {
            document.getElementById('bookModal').classList.add('active');
        }

        function closeBookModal() {
            document.getElementById('bookModal').classList.remove('active');
            document.getElementById('bookTitle').value = '';
            document.getElementById('bookAuthor').value = '';
            document.getElementById('bookNote').value = '';
        }

        function saveBook() {
            var title = document.getElementById('bookTitle').value.trim();
            var author = document.getElementById('bookAuthor').value.trim();
            var note = document.getElementById('bookNote').value.trim();
            if (!title) { alert('请输入书名'); return; }
            books.push({id: Date.now(), title: title, author: author, note: note});
            saveData();
            renderBooks();
            closeBookModal();
        }

        function renderIdeas() {
            var list = document.getElementById('ideaList');
            if (ideas.length === 0) {
                list.innerHTML = '<div class="empty-state">还没有灵感</div>';
                return;
            }
            var html = '';
            for (var i = 0; i < ideas.length; i++) {
                var idea = ideas[i];
                html += '<div class="idea-card">';
                html += '<div>' + idea.text + '</div>';
                html += '<div style="font-size:12px;color:#888;margin-top:6px;">' + idea.date + '</div>';
                html += '</div>';
            }
            list.innerHTML = html;
        }

        function addIdea() {
            var input = document.getElementById('ideaInput');
            var text = input.value.trim();
            if (!text) return;
            var now = new Date();
            var dateStr = (now.getMonth()+1) + '月' + now.getDate() + '日';
            ideas.unshift({id: Date.now(), text: text, date: dateStr});
            saveData();
            input.value = '';
            renderIdeas();
        }

        function renderExpenses() {
            var list = document.getElementById('expenseList');
            var balance = 0;
            for (var i = 0; i < expenses.length; i++) {
                balance += expenses[i].type === 'income' ? expenses[i].amount : -expenses[i].amount;
            }
            document.getElementById('totalBalance').textContent = '¥' + balance;
            
            if (expenses.length === 0) {
                list.innerHTML = '<div class="empty-state">还没有记账</div>';
                return;
            }
            var html = '';
            for (var i = 0; i < expenses.length; i++) {
                var e = expenses[i];
                html += '<div class="expense-item">';
                html += '<span>' + e.name + '</span>';
                html += '<span style="color:' + (e.type === 'income' ? '#6b9b6b' : '#c97e7e') + '">' + (e.type === 'income' ? '+' : '-') + '¥' + e.amount + '</span>';
                html += '</div>';
            }
            list.innerHTML = html;
        }

        function addExpense() {
            var name = document.getElementById('expenseName').value.trim();
            var amount = parseFloat(document.getElementById('expenseAmount').value);
            if (!name || !amount) { alert('请输入名称和金额'); return; }
            expenses.unshift({id: Date.now(), name: name, amount: amount, type: 'expense'});
            saveData();
            document.getElementById('expenseName').value = '';
            document.getElementById('expenseAmount').value = '';
            renderExpenses();
        }

        function renderWords() {
            document.getElementById('wordCount').textContent = words.length;
            var list = document.getElementById('wordList');
            if (words.length === 0) {
                list.innerHTML = '<div style="color:#888;font-size:14px;">还没有单词</div>';
                return;
            }
            var html = '';
            for (var i = 0; i < words.length; i++) {
                html += '<span class="word-tag">' + words[i] + '</span>';
            }
            list.innerHTML = html;
        }

        function addWord() {
            var input = document.getElementById('wordInput');
            var word = input.value.trim();
            if (!word) return;
            words.push(word);
            saveData();
            input.value = '';
            renderWords();
        }

        function renderCreator() {
            var list = document.getElementById('topicList');
            if (topics.length === 0) {
                list.innerHTML = '<div class="empty-state">还没有选题</div>';
                return;
            }
            var html = '';
            for (var i = 0; i < topics.length; i++) {
                var topic = topics[i];
                html += '<div class="idea-card">';
                html += '<div style="font-weight:600;">' + topic.title + '</div>';
                html += '<div style="font-size:12px;color:#888;margin-top:6px;">' + topic.date + '</div>';
                html += '</div>';
            }
            list.innerHTML = html;
        }

        function openTopicModal() {
            document.getElementById('topicModal').classList.add('active');
        }

        function closeTopicModal() {
            document.getElementById('topicModal').classList.remove('active');
            document.getElementById('topicTitle').value = '';
            document.getElementById('topicOutline').value = '';
        }

        function saveTopic() {
            var title = document.getElementById('topicTitle').value.trim();
            var outline = document.getElementById('topicOutline').value.trim();
            if (!title) { alert('请输入标题'); return; }
            var now = new Date();
            var dateStr = (now.getMonth()+1) + '月' + now.getDate() + '日';
            topics.unshift({id: Date.now(), title: title, outline: outline, date: dateStr});
            saveData();
            renderCreator();
            closeTopicModal();
        }

        function checkInMorning() {
            var now = new Date();
            var timeStr = now.getHours() + ':' + (now.getMinutes() < 10 ? '0' : '') + now.getMinutes();
            morningData.checkIns.push({date: now.toDateString(), time: timeStr});
            saveData();
            document.getElementById('wakeUpTime').textContent = timeStr;
            alert('打卡成功！');
        }

        function addMorningActivity() {
            var type = document.getElementById('morningActivityType').value;
            var duration = parseInt(document.getElementById('morningDuration').value);
            if (!duration) { alert('请输入时长'); return; }
            morningData.activities.push({type: type, duration: duration});
            saveData();
            renderMorning();
        }

        function renderMorning() {
            var schedule = document.getElementById('morningSchedule');
            if (morningData.activities.length === 0) {
                schedule.innerHTML = '<div class="empty-state">还没有安排活动</div>';
                return;
            }
            var html = '';
            for (var i = 0; i < morningData.activities.length; i++) {
                var act = morningData.activities[i];
                html += '<div class="todo-item">';
                html += '<span>' + act.type + '</span>';
                html += '<span>' + act.duration + '分钟</span>';
                html += '</div>';
            }
            schedule.innerHTML = html;
        }

        function saveAiNote() {
            aiNote = document.getElementById('aiNote').value;
            localStorage.setItem('aiNote', aiNote);
        }

        updateDate();
        renderTodos();
        renderBooks();
        renderIdeas();
        renderExpenses();
        renderWords();
        renderCreator();
        renderMorning();
        document.getElementById('aiNote').value = aiNote;

        document.getElementById('bookModal').onclick = function(e) {
            if (e.target === this) closeBookModal();
        };
        document.getElementById('topicModal').onclick = function(e) {
            if (e.target === this) closeTopicModal();
        };
    </script>
</body>
</html>
