<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的工作台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: #f5f0e8;
            color: #333;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #5a7c5a 0%, #4a6c4a 100%);
            color: white;
            padding: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .menu-toggle {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-title { font-size: 20px; font-weight: 600; }
        .header-date { font-size: 13px; opacity: 0.9; }
        .reset-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 70px;
            background: #4a6c4a;
            z-index: 200;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            overflow-y: auto;
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .sidebar.active {
            transform: translateX(0);
        }
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 150;
            display: none;
        }
        .sidebar-overlay.active {
            display: block;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 10px 4px;
            cursor: pointer;
            font-size: 11px;
            color: rgba(255,255,255,0.7);
            width: 60px;
            border-radius: 10px;
            text-align: center;
        }
        .nav-item:hover {
            background: rgba(255,255,255,0.1);
        }
        .nav-item.active {
            background: rgba(255,255,255,0.2);
            color: white;
        }
        .nav-icon {
            font-size: 22px;
        }
        .content {
            padding: 16px;
            padding-bottom: 20px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .todo-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: #f5f0e8;
            border-radius: 10px;
            margin-bottom: 8px;
        }
        .todo-checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid #7a9c7a;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .todo-checkbox.checked {
            background: #5a7c5a;
            border-color: #5a7c5a;
        }
        .todo-checkbox.checked::after {
            content: '✓';
            color: white;
            font-size: 12px;
        }
        .todo-text { flex: 1; font-size: 15px; }
        .todo-text.completed {
            text-decoration: line-through;
            color: #888;
        }
        .todo-input-area {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .todo-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #e8e4dc;
            border-radius: 10px;
            font-size: 15px;
            background: #f5f0e8;
        }
        .btn-primary {
            background: #5a7c5a;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        .finance-box {
            background: #f5f0e8;
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            margin-bottom: 12px;
        }
        .finance-value {
            font-size: 24px;
            font-weight: 700;
            color: #5a7c5a;
        }
        .finance-label {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        .word-tag {
            display: inline-block;
            background: #f5f0e8;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
            margin: 4px;
        }
        .idea-card {
            background: linear-gradient(135deg, #fff9e6 0%, #fff5d6 100%);
            border-left: 4px solid #c9a96e;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .book-card {
            background: #f5f0e8;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 10px;
        }
        .expense-item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid #e8e4dc;
        }
        .form-input, .form-textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #e8e4dc;
            border-radius: 10px;
            font-size: 15px;
            margin-bottom: 10px;
        }
        .form-textarea {
            min-height: 80px;
            resize: vertical;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .modal-close {
            font-size: 24px;
            color: #888;
            cursor: pointer;
        }
        .viral-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .viral-title {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .viral-tags {
            margin-bottom: 8px;
        }
        .viral-tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 12px;
            margin-right: 6px;
        }
        .viral-tag.platform {
            background: #ff2442;
            color: white;
        }
        .viral-tag.category {
            background: #f0f0f0;
            color: #666;
        }
        .viral-stats {
            font-size: 13px;
            color: #888;
            margin-bottom: 10px;
        }
        .viral-reason {
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
            line-height: 1.4;
        }
        .viral-label {
            display: inline-block;
            background: #8b7355;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-right: 6px;
        }
        .viral-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .viral-btn-outline {
            flex: 1;
            background: white;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .viral-btn-green {
            flex: 1;
            background: #5a7c5a;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .calendar-widget {
            background: #faf8f3;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid #e8e4dc;
            position: relative;
        }
        .calendar-day-view {
            text-align: center;
            padding: 20px 16px;
        }
        .calendar-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px 12px;
            border-bottom: 1px solid #e8e4dc;
            margin-bottom: 16px;
        }
        .calendar-top-bar span {
            font-size: 14px;
            color: #888;
        }
        .calendar-big-date {
            font-size: 100px;
            font-weight: 300;
            color: #5a7c5a;
            line-height: 1;
            font-family: Georgia, serif;
            margin: 10px 0;
        }
        .calendar-weekday {
            font-size: 16px;
            color: #666;
            margin-bottom: 4px;
        }
        .calendar-full-date {
            font-size: 13px;
            color: #888;
            margin-bottom: 8px;
        }
        .calendar-lunar {
            font-size: 14px;
            color: #8b7355;
            margin-bottom: 8px;
        }
        .calendar-holiday-tag {
            display: inline-block;
            background: #c97e7e;
            color: white;
            padding: 4px 16px;
            border-radius: 12px;
            font-size: 13px;
        }
        .calendar-weather {
            font-size: 13px;
            color: #888;
            margin-top: 8px;
        }
        .calendar-month-view {
            padding: 16px;
            display: none;
        }
        .calendar-year-view {
            padding: 16px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    
    <div class="sidebar" id="sidebar">
        <div class="nav-item active" onclick="switchSection('todo')">
            <span class="nav-icon">🏠</span>
            <span>首页</span>
        </div>
        <div class="nav-item" onclick="switchSection('books')">
            <span class="nav-icon">📚</span>
            <span>读书</span>
        </div>
        <div class="nav-item" onclick="switchSection('ideas')">
            <span class="nav-icon">💡</span>
            <span>灵感</span>
        </div>
        <div class="nav-item" onclick="switchSection('finance')">
            <span class="nav-icon">💰</span>
            <span>记账</span>
        </div>
        <div class="nav-item" onclick="switchSection('english')">
            <span class="nav-icon">🌍</span>
            <span>英语</span>
        </div>
        <div class="nav-item" onclick="switchSection('creator')">
            <span class="nav-icon">🎬</span>
            <span>创作</span>
        </div>
        <div class="nav-item" onclick="switchSection('ai')">
            <span class="nav-icon">🤖</span>
            <span>AI</span>
        </div>
    </div>

    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                <div>
                    <div class="header-title">我的工作台</div>
                    <div class="header-date" id="currentDate">--</div>
                </div>
            </div>
            <button class="reset-btn" onclick="resetToday()">重置今日</button>
        </div>
    </div>

    <div class="content">
        <div class="section active" id="section-todo">
            <div class="section-title">晚上好 👋</div>
            <div style="font-size: 14px; color: #888; margin-bottom: 16px;">今天辛苦啦</div>

            <div class="calendar-widget" id="calendarWidget" onclick="toggleCalendarView()">
                <div class="calendar-day-view" id="calendarDayView"></div>
                <div class="calendar-month-view" id="calendarMonthView"></div>
                <div class="calendar-year-view" id="calendarYearView"></div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px;">
                <div class="card" style="text-align: center; padding: 20px;">
                    <div style="font-size: 28px;">📋</div>
                    <div style="font-size: 24px; font-weight: 700; color: #5a7c5a;" id="todoCount">0/0</div>
                    <div style="font-size: 12px; color: #888;">今日任务</div>
                </div>
                <div class="card" style="text-align: center; padding: 20px;" onclick="switchSection('morning')">
                    <div style="font-size: 28px;">🌅</div>
                    <div style="font-size: 24px; font-weight: 700; color: #5a7c5a;" id="morningCheck">--</div>
                    <div style="font-size: 12px; color: #888;">早起打卡</div>
                </div>
            </div>

            <div class="card">
                <div class="section-title">今日清单</div>
                <div id="todoList"></div>
                <div class="todo-input-area">
                    <input type="text" class="todo-input" id="todoInput" placeholder="添加新任务...">
                    <button class="btn-primary" onclick="addTodo()">添加</button>
                </div>
            </div>
        </div>

        <div class="section" id="section-morning">
            <div class="section-title">早起打卡</div>
            <div class="card" style="text-align: center; padding: 30px;">
                <div style="font-size: 64px; margin-bottom: 16px;">🌅</div>
                <div id="morningCheckBig" style="font-size: 18px; color: #888; margin-bottom: 20px;">今日未打卡</div>
                <div id="morningCheckBtn" class="todo-checkbox" style="width: 60px; height: 60px; margin: 0 auto; font-size: 28px;" onclick="checkInMorning()"></div>
                <div style="font-size: 13px; color: #888; margin-top: 12px;">点击打勾完成早起打卡</div>
            </div>
        </div>

        <div class="section" id="section-books">
            <div class="section-title">读书笔记</div>
            <div class="card" style="margin-bottom: 12px;">
                <div id="notionTokenArea">
                    <input type="text" class="form-input" id="notionTokenInput" placeholder="粘贴 Notion Integration Token...">
                    <input type="text" class="form-input" id="notionDbInput" placeholder="粘贴 Database ID...">
                    <button class="btn-primary" onclick="saveNotionConfig()" style="width: 100%;">保存配置</button>
                </div>
                <div id="notionSyncArea" style="display:none;">
                    <button class="btn-primary" onclick="syncNotion()" style="width: 100%;">🔄 同步 Notion 知识库</button>
                    <button class="btn-primary" onclick="editNotionConfig()" style="width: 100%; margin-top: 8px; background: #888;">修改配置</button>
                </div>
                <div id="notionStatus" style="font-size: 12px; color: #888; text-align: center; margin-top: 8px;">首次使用请输入 Notion Token 和 Database ID</div>
            </div>
            <div id="notionCards"></div>
            <div style="margin: 16px 0; border-top: 1px dashed #ccc; padding-top: 16px;">
                <div style="font-size: 14px; color: #888; margin-bottom: 10px;">本地书籍记录</div>
                <div id="bookList"></div>
                <button class="btn-primary" onclick="openBookModal()" style="margin-top: 12px;">+ 添加书籍</button>
            </div>
        </div>

        <div class="section" id="section-ideas">
            <div class="section-title">灵感收集</div>
            <div class="card">
                <textarea class="form-textarea" id="ideaInput" placeholder="记录灵感..."></textarea>
                <button class="btn-primary" onclick="addIdea()">记录灵感</button>
            </div>
            <div id="ideaList"></div>
        </div>

        <div class="section" id="section-finance">
            <div class="section-title">理财记账</div>
            <div class="finance-box">
                <div class="finance-value" id="totalBalance">¥0</div>
                <div class="finance-label">结余</div>
            </div>
            <div class="card">
                <div id="expenseList"></div>
                <input type="text" class="form-input" id="expenseName" placeholder="项目名称">
                <input type="number" class="form-input" id="expenseAmount" placeholder="金额">
                <button class="btn-primary" onclick="addExpense()">记账</button>
            </div>
        </div>

        <div class="section" id="section-english">
            <div class="section-title">英语学习</div>
            <div class="card">
                <div class="finance-box">
                    <div class="finance-value" id="wordCount">0</div>
                    <div class="finance-label">今日单词</div>
                </div>
                <div class="todo-input-area">
                    <input type="text" class="todo-input" id="wordInput" placeholder="输入单词...">
                    <button class="btn-primary" onclick="addWord()">添加</button>
                </div>
                <div id="wordList"></div>
            </div>
        </div>

        <div class="section" id="section-ai">
            <div class="section-title">AI学习</div>
            <div class="card">
                <div class="book-card" onclick="window.open('https://www.deeplearning.ai/','_blank')">
                    <div style="font-size: 24px;">🎓</div>
                    <div style="font-weight: 600;">DeepLearning.AI</div>
                    <div style="font-size: 13px; color: #888;">吴恩达的AI课程</div>
                </div>
                <div class="book-card" onclick="window.open('https://huggingface.co/','_blank')">
                    <div style="font-size: 24px;">🤗</div>
                    <div style="font-weight: 600;">Hugging Face</div>
                    <div style="font-size: 13px; color: #888;">开源AI模型社区</div>
                </div>
                <textarea class="form-textarea" id="aiNote" placeholder="学习笔记..." onblur="saveAiNote()"></textarea>
            </div>
        </div>

        <div class="section" id="section-creator">
            <div class="section-title">自媒体创作</div>
            
            <div class="card" style="margin-bottom: 12px;">
                <button class="btn-primary" onclick="generateTopicsFromNotion()" style="width: 100%;">💡 从读书笔记生成选题</button>
                <div id="generateStatus" style="font-size: 12px; color: #888; text-align: center; margin-top: 8px;">基于你的 Notion 知识库自动推荐</div>
            </div>
            
            <div id="generatedTopics"></div>
            
            <div style="margin: 16px 0; border-top: 1px dashed #ccc; padding-top: 16px;">
                <div style="font-size: 14px; color: #888; margin-bottom: 10px;">爆款笔记分析</div>
                <div id="topicList"></div>
                <button class="btn-primary" onclick="openTopicModal()" style="margin-top: 12px;">+ 添加爆款分析</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="bookModal">
        <div class="modal">
            <div class="modal-header">
                <div style="font-weight: 600;">添加书籍</div>
                <span class="modal-close" onclick="closeBookModal()">×</span>
            </div>
            <input type="text" class="form-input" id="bookTitle" placeholder="书名">
            <input type="text" class="form-input" id="bookAuthor" placeholder="作者">
            <textarea class="form-textarea" id="bookNote" placeholder="读书笔记..."></textarea>
            <button class="btn-primary" onclick="saveBook()" style="width: 100%;">保存</button>
        </div>
    </div>

    <div class="modal-overlay" id="topicModal">
        <div class="modal">
            <div class="modal-header">
                <div style="font-weight: 600;">添加爆款分析</div>
                <span class="modal-close" onclick="closeTopicModal()">×</span>
            </div>
            <input type="text" class="form-input" id="topicTitle" placeholder="视频/笔记标题">
            <input type="text" class="form-input" id="topicPlatform" placeholder="平台 (抖音/小红书/B站)">
            <input type="text" class="form-input" id="topicStats" placeholder="数据 (如: 赞50.1万·收藏29.6万)">
            <input type="text" class="form-input" id="topicWhy" placeholder="为什么火">
            <input type="text" class="form-input" id="topicLearn" placeholder="可借鉴点">
            <input type="text" class="form-input" id="topicUrl" placeholder="视频链接">
            <button class="btn-primary" onclick="saveTopic()" style="width: 100%;">保存</button>
        </div>
    </div>

    <script>
        var todos = JSON.parse(localStorage.getItem('todos') || '[{"id":1,"text":"阅读30分钟","completed":false},{"id":2,"text":"背单词50个","completed":false},{"id":3,"text":"记录今日开销","completed":false}]');
        var books = JSON.parse(localStorage.getItem('books') || '[]');
        var ideas = JSON.parse(localStorage.getItem('ideas') || '[]');
        var expenses = JSON.parse(localStorage.getItem('expenses') || '[]');
        var words = JSON.parse(localStorage.getItem('words') || '[]');
        var topics = JSON.parse(localStorage.getItem('topics') || '[]');
        var morningData = JSON.parse(localStorage.getItem('morningData') || '{"checkIns":[],"activities":[],"streak":0}');
        var aiNote = localStorage.getItem('aiNote') || '';

        function saveData() {
            localStorage.setItem('todos', JSON.stringify(todos));
            localStorage.setItem('books', JSON.stringify(books));
            localStorage.setItem('ideas', JSON.stringify(ideas));
            localStorage.setItem('expenses', JSON.stringify(expenses));
            localStorage.setItem('words', JSON.stringify(words));
            localStorage.setItem('topics', JSON.stringify(topics));
            localStorage.setItem('morningData', JSON.stringify(morningData));
            localStorage.setItem('aiNote', aiNote);
        }

        function toggleSidebar() {
            var sidebar = document.getElementById('sidebar');
            var overlay = document.getElementById('sidebarOverlay');
            if (sidebar.classList.contains('active')) {
                sidebar.classList.remove('active');
                overlay.classList.remove('active');
            } else {
                sidebar.classList.add('active');
                overlay.classList.add('active');
            }
        }

        function switchSection(section) {
            var sections = document.querySelectorAll('.section');
            for (var i = 0; i < sections.length; i++) {
                sections[i].classList.remove('active');
            }
            document.getElementById('section-' + section).classList.add('active');
            
            var navItems = document.querySelectorAll('.nav-item');
            for (var i = 0; i < navItems.length; i++) {
                navItems[i].classList.remove('active');
            }
            if (event && event.currentTarget) {
                event.currentTarget.classList.add('active');
            }
            
            toggleSidebar();
        }

        var holidays = {

            if (lunarToday) dayHtml += '<div class="calendar-lunar">' + lunarToday + '</div>';
            if (holidayToday) dayHtml += '<div class="calendar-holiday-tag">' + holidayToday + '</div>';
            dayHtml += '<div class="calendar-weather">☀️ 天气晴朗 26°C</div>';

            document.getElementById('calendarDayView').innerHTML = dayHtml;

            var firstDay = new Date(year, month, 1).getDay();
            var daysInMonth = new Date(year, month + 1, 0).getDate();
            var monthHtml = '<div style="font-size:16px;font-weight:600;text-align:center;margin-bottom:12px;">' + year + '年 ' + cnMonths[month] + '</div>';
            monthHtml += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:11px;color:#888;margin-bottom:8px;">';

                var h = getHoliday(month+1, d, year, month+1, d);
                var style = 'padding:8px;border-radius:50%;font-size:14px;';

        function generateTopicsFromNotion() {
            var status = document.getElementById('generateStatus');
            status.textContent = '正在分析知识库...';
            status.style.color = '#5a7c5a';

            if (!notionToken || !notionDbId) {
                status.textContent = '请先配置 Notion（去读书笔记页面设置）';
                status.style.color = '#c97e7e';
                return;
            }

            var proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent('https://api.notion.com/v1/databases/' + notionDbId + '/query');

            fetch(proxyUrl, {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + notionToken,
                    'Notion-Version': '2022-06-28',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ page_size: 50 })
            })
            .then(function(response) {
                if (!response.ok) throw new Error('查询失败');
                return response.json();
            })
            .then(function(data) {
                if (data.object === 'error') throw new Error(data.message || 'API错误');
                renderGeneratedTopics(data.results);
                status.textContent = '已根据 ' + (data.results ? data.results.length : 0) + ' 条笔记生成选题';
                status.style.color = '#5a7c5a';
            })
            .catch(function(error) {
                status.textContent = '生成失败: ' + error.message;
                status.style.color = '#c97e7e';
            });
        }

        function renderGeneratedTopics(results) {
            var container = document.getElementById('generatedTopics');
            if (!results || results.length === 0) {
                container.innerHTML = '<div class="empty-state">知识库为空，无法生成选题</div>';
                return;
            }

            var templates = [
                '读完《{title}》后，我悟了：{insight}',
                '为什么{title}值得每个人读？',
                '{title}教会我的3个道理',
                '从{title}看{topic}的本质',
                '如果早点读到{title}，我会...'
            ];

            var html = '<div style="font-size: 14px; color: #888; margin-bottom: 10px;">AI推荐选题</div>';
            var count = 0;

            for (var i = 0; i < results.length && count < 5; i++) {
                var page = results[i];
                var props = page.properties;
                var title = '';
                var content = '';

                for (var key in props) {
                    var prop = props[key];
                    if (prop.type === 'title' && prop.title && prop.title.length > 0) {
                        title = prop.title[0].plain_text;
                    }
                    if (prop.type === 'rich_text' && prop.rich_text && prop.rich_text.length > 0) {
                        content = prop.rich_text[0].plain_text;
                    }
                }

                if (!title) continue;

                var tmpl = templates[count % templates.length];
                var insight = content ? content.substring(0, 30) : '这个知识点太重要了';
                var topicTitle = tmpl.replace('{title}', title).replace('{insight}', insight).replace('{topic}', title);

                html += '<div class="idea-card" style="background: linear-gradient(135deg, #f0f7f0 0%, #e8f0e8 100%); border-left-color: #5a7c5a;">';
                html += '<div style="font-weight:600;font-size:15px;margin-bottom:8px;">' + topicTitle + '</div>';
                html += '<div style="font-size:12px;color:#888;margin-bottom:8px;">来源: ' + title + '</div>';
                html += '<div class="viral-actions">';
                html += '<button class="viral-btn-outline" onclick="saveGeneratedTopic(\'' + topicTitle.replace(/'/g, "\\'") + '\')">+ 加入选题库</button>';
                html += '</div>';
                html += '</div>';
                count++;
            }

            container.innerHTML = html;
        }

                if (data.object === 'error') throw new Error(data.message || 'API错误');
                renderNotionCards(data.results);
                status.textContent = '同步成功！共 ' + (data.results ? data.results.length : 0) + ' 条笔记';
                status.style.color = '#5a7c5a';
            })
            .catch(function(error) {
                status.textContent = '同步失败: ' + error.message;
                status.style.color = '#c97e7e';
            });
        }

        function renderNotionCards(results) {
            var container = document.getElementById('notionCards');
            if (!results || results.length === 0) {
                container.innerHTML = '<div class="empty-state">Notion 知识库为空</div>';
                return;
            }

            var html = '';
            for (var i = 0; i < results.length; i++) {
                var page = results[i];
                var props = page.properties;
                var title = '';
                var content = '';
                var tags = '';
                var dateStr = '';

                for (var key in props) {
                    var prop = props[key];
                    if (prop.type === 'title' && prop.title && prop.title.length > 0) {
                        title = prop.title[0].plain_text;
                    }
                    if (prop.type === 'rich_text' && prop.rich_text && prop.rich_text.length > 0) {
                        content = prop.rich_text[0].plain_text;
                    }
                    if (prop.type === 'multi_select' && prop.multi_select) {
                        for (var t = 0; t < prop.multi_select.length; t++) {
                            tags += '<span style="display:inline-block;background:#e8f0e8;color:#5a7c5a;padding:2px 8px;border-radius:10px;font-size:11px;margin-right:4px;">' + prop.multi_select[t].name + '</span>';
                        }
                    }
                    if (prop.type === 'select' && prop.select) {
                        tags += '<span style="display:inline-block;background:#e8f0e8;color:#5a7c5a;padding:2px 8px;border-radius:10px;font-size:11px;margin-right:4px;">' + prop.select.name + '</span>';
                    }
                    if (prop.type === 'created_time' && prop.created_time) {
                        var d = new Date(prop.created_time);
                        dateStr = (d.getMonth()+1) + '月' + d.getDate() + '日';
                    }
                }

                if (!title) title = '未命名笔记';

                html += '<div class="idea-card" style="background: linear-gradient(135deg, #f0f7f0 0%, #e8f0e8 100%); border-left-color: #5a7c5a;">';
                html += '<div style="font-weight:600;font-size:15px;margin-bottom:6px;">' + title + '</div>';
                if (content) html += '<div style="font-size:13px;color:#555;margin-bottom:8px;line-height:1.5;">' + content + '</div>';
                if (tags) html += '<div style="margin-bottom:6px;">' + tags + '</div>';
                if (dateStr) html += '<div style="font-size:11px;color:#888;">' + dateStr + '</div>';
                html += '</div>';
            }
            container.innerHTML = html;
        }

        updateDate();
        renderCalendar();
        renderTodos();
        updateTodoCount();
        renderBooks();
        renderIdeas();
        renderExpenses();
        renderWords();
        renderCreator();
        renderMorning();
        document.getElementById('aiNote').value = aiNote;
        initNotionUI();

        document.getElementById('bookModal').onclick = function(e) {
            if (e.target === this) closeBookModal();
        };
        document.getElementById('topicModal').onclick = function(e) {
            if (e.target === this) closeTopicModal();
        };
    </script>
</body>
</html>
